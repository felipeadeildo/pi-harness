# Checks npm for a newer pi SDK: a version that passes opens a bump PR, one that fails files an
# issue. A cron, because npm sends no event, and by hand for a re-check. `CI` already runs verify on
# every push, so nothing here looks at a pin that did not move. The steps are in
# scripts/newest-pi.ts.
#
# GitHub stops a cron after 60 days without activity in the repository; re-enable it from the
# Actions tab if that happens.
name: Newest pi

on:
  schedule:
    # 09:00 UTC, after pi usually publishes.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: newest-pi
  cancel-in-progress: false

jobs:
  newest-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - id: compare
        run: bun scripts/newest-pi.ts compare

      - if: steps.compare.outputs.test == 'true'
        run: bun install --frozen-lockfile

      # --exact, so the pin stays a version and not a range.
      - if: steps.compare.outputs.test == 'true'
        run: bun add --dev --exact @earendil-works/pi-ai@latest @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest

      # One retry, because Bun has flaked in the runner (EINVAL from epoll_ctl while spawning the
      # shell in the bash timer tests). A second failure is worth an issue.
      - id: verify
        if: steps.compare.outputs.test == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          if bun run verify 2>&1 | tee verify.log; then exit 0; fi
          echo "::warning::verify failed, retrying once"
          bun run verify 2>&1 | tee verify.log

      - if: steps.compare.outputs.test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          retention-days: 14

      - if: steps.compare.outputs.test == 'true'
        run: bun scripts/newest-pi.ts report
        env:
          VERIFY: ${{ steps.verify.outcome }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          NEWEST: ${{ steps.compare.outputs.newest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
