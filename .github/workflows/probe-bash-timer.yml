# Did the spawn bug come back? Bun once failed to spawn the shell in the bash timer tests on the
# runner, which put a retry in ci.yml from 04/10 to 24/10. Fifty runs on the pinned Bun found none,
# and the retry went. Run this by hand after a Bun bump: `gh workflow run probe-bash-timer.yml`.
#
# The run is red exactly when the bug reproduces, so the colour of the run is the answer, and the
# log carries the count, the commit and the version. Each failure echoes up to five lines of its
# output that name the cause, which is more useful than a count per kind. A red run means the bug is
# back and a retry is warranted again, with these runs as its evidence.
name: probe bash timer

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    # Spawning a shell can hang. Without this, a stuck run holds the runner for the default hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: bash timer, fifty times
        run: |
          echo "commit $(git rev-parse --short HEAD), bun $(bun --version)"
          fails=0
          for i in $(seq 1 50); do
            if ! bun test packages/ask-permission/test/bash-timer.test.ts > /tmp/run.log 2>&1; then
              fails=$((fails + 1))
              echo "run $i failed:"
              # `|| true` because the grep matching nothing must not end the loop under pipefail.
              grep -E "epoll_ctl|EINVAL|error:|fail" /tmp/run.log | head -5 || true
            fi
          done
          echo "failures: $fails of 50"
          if [ "$fails" -gt 0 ]; then
            echo "the spawn bug reproduced $fails times in 50: a retry in ci.yml is warranted again"
            exit 1
          fi
          echo "no failure in 50: the spawn bug is gone on this Bun, and no retry is needed"
