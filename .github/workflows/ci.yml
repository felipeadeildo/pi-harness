# Types, lint, format, tests, the pictures in the docs, and the pi defaults the harness settings
# were chosen against. `bun run verify` lists them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, and not to latest on purpose: a new Bun changes how the CI behaves without a
      # commit, and the retry below exists because of one Bun's behaviour. Bumping this is a pull
      # request, so the change has a diff and a run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # One retry, because Bun has flaked in the runner: spawning the shell in the bash timer tests
      # fails with EINVAL from epoll_ctl, the same fd collision we traced on the laptop. A second
      # failure is real. Last evidence: 04/10, on a Bun before 1.4.4. The two test flakes measured on
      # 24/10 were fixed in #93 and #104, so this retry stands for the spawn alone.
      - run: |
          if bun run verify; then exit 0; fi
          echo "::warning::verify failed, retrying once"
          bun run verify

  # The web app's done-when is a browser, so it gets its own job: the export takes about twenty
  # seconds and the check needs a Chrome, and neither belongs in the verify every PR pays for. The
  # runner's own Chrome is used, so nothing is downloaded.
  app:
    runs-on: ubuntu-latest
    env:
      # The check refuses to skip here: a job that prints "skipped" and stays green runs nothing.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # Pinned, not latest: the export and the browser check must run on the Bun the rest of the CI
      # runs, and a new Bun changes how they behave without a commit. Bumping this is a pull request.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run app:export
      - run: bun run csp:check
