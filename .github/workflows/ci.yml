# Types, lint, format, tests, the pictures in the docs, and the pi defaults the harness settings
# were chosen against. `bun run verify` lists them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # One retry, because Bun has flaked in the runner: spawning the shell in the bash timer tests
      # fails with EINVAL from epoll_ctl, the same fd collision we traced on the laptop. A second
      # failure is real.
      - run: |
          if bun run verify; then exit 0; fi
          echo "::warning::verify failed, retrying once"
          bun run verify
