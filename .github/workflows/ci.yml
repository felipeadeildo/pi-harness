# Types, lint, format, tests, the pictures in the docs, and the pi defaults the harness settings
# were chosen against. `bun run verify` lists them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, here and in every workflow: a new Bun changes how the CI behaves without a commit, so
      # bumping it is a pull request with a diff and a run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # The gate: the page in a real browser, with a real daemon and a real pi session behind it, served
  # with the daemon's policy. The runner's own Chrome is used, so nothing is downloaded.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The daemon serves the page it finds at startup, so the build comes first.
      - run: bun run --cwd packages/remote build
      - run: bun run gate
