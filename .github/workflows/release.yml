# Releases and publishes in one run. Publishing on the `release` event would not fire, because
# GitHub does not trigger workflows from events created with the default GITHUB_TOKEN.
#
# release-please reads release-please-config.json and .release-please-manifest.json, so a package
# only releases once it is listed there. Merging its release PR tags each package as
# `<component>-v<version>`; the same run then verifies and publishes to npm.
#
# Publishing is npm trusted publishing over OIDC, so there is no NPM_TOKEN secret. Each package
# needs its own trusted publisher pointing at this workflow: `bun run trust`, run locally.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      paths:
        description: 'Package folders to publish, as a JSON array, e.g. ["packages/kit"]'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # release-please bumps every package.json but can't run bun, so bun.lock keeps the old versions
  # of the workspace packages, and `bun pm pack` writes the dependency version from the lockfile.
  # This commits the refreshed lockfile onto the release PR's branch. A push made with GITHUB_TOKEN
  # triggers no workflow, and release-please rewrites the branch on its next run, so this runs again.
  lockfile:
    needs: release
    if: ${{ needs.release.outputs.pr != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release.outputs.pr).headBranchName }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Commit bun.lock
        run: |
          git diff --quiet bun.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh bun.lock" bun.lock
          git push

  verify:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run verify

      # Packs every package, installs the tarballs outside the repository and loads them, so a
      # missing file or an unresolved workspace dependency fails before anything is published.
      - run: bun run smoke

  publish:
    needs: [release, verify]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing wants npm >= 11.5.1, which the runner image may predate.
      - run: npm install -g npm@^11.5.1

      # Publishes in dependency order and skips versions that are already on npm, so a run that
      # died halfway can be started again.
      - name: Publish
        env:
          PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.paths || needs.release.outputs.paths }}
        run: bun scripts/publish.ts --paths "$(echo "$PATHS" | jq -r 'join(",")')"
